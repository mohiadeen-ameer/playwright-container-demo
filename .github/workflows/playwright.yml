name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-screenshots:
    runs-on: ubuntu-latest
    # Same image as ./test.sh and ./shoot.sh, so CI renders exactly what you see locally.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests (functional + visual)
        run: npx playwright test
        env:
          CI: "true"

      - name: Build screenshots and slide deck
        if: always()
        run: node shoot.mjs

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload screenshots and deck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-deck
          path: out/
          retention-days: 14
