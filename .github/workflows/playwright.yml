name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Same image as ./test.sh, so CI renders exactly what you see locally.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - name: Run tests (functional + visual)
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload report and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - name: Build screenshots and slide deck
        run: node shoot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-deck
          path: out/
          retention-days: 14
